# author: Martin Kraemer, mk.maddin@gmail.com
# description: YAML configuration file - holding component services

set_next_trip:
  name: Set Next Trip
  description: Set the time for the next trip used by next trip charging mode
  fields:
    device_id:
      name: Charger
      description: Charger device for which to apply change
      example: 1625eec2e3f83829c2d52999ecdd2036
      selector:
        device:
          integration: wattpilot
    trigger_time:
      name: NextTrip
      description: Next trip time
      example: 06:30:00
      selector:
        time:

set_charging_schedule:
  name: Set charging schedule
  description: Write one day type of the app's charging schedule (charging times) to the charger. Fields left empty keep their current value.
  fields:
    device_id:
      name: Charger
      description: Charger device for which to apply change
      example: 1625eec2e3f83829c2d52999ecdd2036
      selector:
        device:
          integration: wattpilot
    day_type:
      name: Day type
      description: Which schedule to change - weekdays, saturday or sunday
      required: true
      example: weekdays
      selector:
        select:
          translation_key: day_type
          options:
            - weekdays
            - saturday
            - sunday
    limit_charging_times:
      name: Limit charging times
      description: Only charge inside the charging times
      example: true
      selector:
        boolean:
    pv_surplus_outside_times:
      name: PV surplus outside times
      description: Allow charging with PV surplus outside the charging times
      example: true
      selector:
        boolean:
    ranges:
      name: Charging times
      description: The charging windows as a list of begin/end times of day (HH:MM). Each window must end after it begins on the same day and windows must not overlap; split a window over midnight into an evening and a morning one, as the app does
      example:
        - begin: "00:00"
          end: "06:00"
        - begin: "08:00"
          end: "15:00"
      selector:
        object:

set_goe_cloud:
  name: Set Go-E Cloud
  description: Enable or disable the Go-E cloud access for wallbox
  fields:
    device_id:
      name: Charger
      description: Charger device for which to apply change
      example: 1625eec2e3f83829c2d52999ecdd2036
      selector:
        device:
          integration: wattpilot
    cloud_api:
      name: CloudAPI
      description: Turn E-Cloud Api access ON or OFF
      example: False
      selector:
        boolean:

set_debug_properties:
  name: Set debug properties
  description: Enable or disable logging of charger property changes as warning within logs
  fields:
    device_id:
      name: Charger
      description: Charger device for which to apply change
      example: 1625eec2e3f83829c2d52999ecdd2036
      selector:
        device:
          integration: wattpilot
    debug_properties:
      name: Debug
      description: TRUE to debug all properties; FALSE to debug none; list of properties to debug only these
      example: 
        - wda
        - cci
        - err

disconnect_charger:
  name: Disconnect Charger
  description: Disconnect an established charger connection (entities will be unavailable)
  fields:
    device_id:
      name: Charger
      description: Charger device for which to apply change
      example: 1625eec2e3f83829c2d52999ecdd2036
      selector:
        device:
          integration: wattpilot

reconnect_charger:
  name: ReConnect Charger
  description: (Re)connect an disconnected charger connection
  fields:
    device_id:
      name: Charger
      description: Charger device for which to apply change
      example: 1625eec2e3f83829c2d52999ecdd2036
      selector:
        device:
          integration: wattpilot
